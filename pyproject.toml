[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-booking-system"
version = "1.0.0"
description = "A Movie Ticket Booking System for CSCN73010 Assignment 4"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Student"}
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
